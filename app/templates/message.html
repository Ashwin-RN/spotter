{% extends "base.html" %}
{% block title %}{{ title }} · Spotter{% endblock %}
{% block main %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if fix %}<p class="muted">{{ fix }}</p>{% endif %}
  <div class="actions">
    <a href="/">Home</a>
    {% if web_ready and not signed_in %}<a href="/sign-in">Sign in</a>{% endif %}
  </div>
</div>
{% endblock %}
