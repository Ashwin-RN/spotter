<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Spotter{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body{% if time_zone_missing %} data-time-zone="missing"{% endif %}>
  <header class="top">
    <a class="brand" href="/">Spotter</a>
    {% if signed_in %}
    <nav>
      <a href="/today">Today</a>
      <a href="/progress">Progress</a>
      <a href="/settings">Settings</a>
      <form method="post" action="/sign-out" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link">Sign out</button>
      </form>
    </nav>
    {% elif web_ready %}
    <nav><a href="/sign-in">Sign in</a></nav>
    {% endif %}
  </header>
  <main>{% block main %}{% endblock %}</main>
  {% if attribution %}<footer class="attribution">{{ attribution }}</footer>{% endif %}
  {% if time_zone_missing %}
  <form id="auto-time-zone" method="post" action="/settings" hidden>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="time_zone" value="">
    {% if next_path %}<input type="hidden" name="next" value="{{ next_path }}">{% endif %}
  </form>
  <script src="/static/time-zone.js"></script>
  {% endif %}
</body>
</html>
